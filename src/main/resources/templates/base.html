<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека книг</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .book-card {
            transition: transform 0.2s;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }
        .header-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .btn-add {
            background: linear-gradient(45deg, #28a745, #20c997);
            border: none;
            border-radius: 25px;
            padding: 10px 25px;
        }
        .btn-delete {
            background: linear-gradient(45deg, #dc3545, #e83e8c);
            border: none;
            border-radius: 20px;
        }
    </style>
</head>
<body>
<header class="header-gradient text-white py-4 mb-4">
    <div class="container">
        <div class="row align-items-center">
            <div class="col">
                <h1 class="h3 mb-0"><i class="fas fa-book-open me-2"></i>Моя библиотека</h1>
            </div>
            <div class="col-auto">
                <a th:href="@{/books}" class="btn btn-outline-light btn-sm me-2">
                    <i class="fas fa-home me-1"></i>Главная
                </a>
                <a th:href="@{/books/add}" class="btn btn-add text-white">
                    <i class="fas fa-plus me-1"></i>Добавить книгу
                </a>
            </div>
        </div>
    </div>
</header>

<main class="container">
    <div th:replace="${content}"></div>
</main>

<footer class="bg-dark text-white py-3 mt-5">
    <div class="container text-center">
        <small>&copy; 2024 Библиотека книг. Все права защищены.</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
