<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="base :: head">
</head>
<body>
<header th:replace="base :: header"></header>

<main class="container">
    <div class="row mb-4">
        <div class="col">
            <h2 class="text-dark">
                <i class="fas fa-books me-2"></i>Все книги
                <span class="badge bg-primary fs-6" th:text="${#lists.size(allBooks)}">0</span>
            </h2>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(allBooks)}" class="text-center py-5">
        <i class="fas fa-book fa-4x text-muted mb-3"></i>
        <h3 class="text-muted">Библиотека пуста</h3>
        <p class="text-muted">Добавьте свою первую книгу в коллекцию</p>
        <a th:href="@{/books/add}" class="btn btn-add text-white mt-3">
            <i class="fas fa-plus me-1"></i>Добавить книгу
        </a>
    </div>

    <div th:unless="${#lists.isEmpty(allBooks)}" class="row g-4">
        <div th:each="book : ${allBooks}" class="col-md-6 col-lg-4">
            <div class="card book-card h-100">
                <div class="card-body">
                    <h5 class="card-title text-primary" th:text="${book.title}">Название</h5>

                    <div class="mb-2">
                        <small class="text-muted"><i class="fas fa-user me-1"></i>Автор:</small>
                        <div class="fw-bold" th:text="|${book.author().lastName()} ${book.author().firstName()} ${book.author().middleName()}|">
                        </div>
                    </div>

                    <div class="mb-2">
                        <small class="text-muted"><i class="fas fa-tag me-1"></i>Жанр:</small>
                        <span class="badge bg-secondary" th:text="${book.genre().name()}">Жанр</span>
                    </div>

                    <div class="mb-2">
                        <small class="text-muted"><i class="fas fa-calendar me-1"></i>Год:</small>
                        <span th:text="${book.year()}">2024</span>
                    </div>

                    <div class="mb-3">
                        <small class="text-muted"><i class="fas fa-map-marker-alt me-1"></i>Место:</small>
                        <span th:text="${book.location()}">Полка</span>
                    </div>
                </div>

                <div class="card-footer bg-transparent">
                    <form th:action="@{/books/delete/{id}(id=${book.id()})}" method="post"
                          onsubmit="return confirm('Удалить книгу \'' + [[${book.title}]] + '\'?')">
                        <button type="submit" class="btn btn-delete text-white w-100">
                            <i class="fas fa-trash me-1"></i>Удалить
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="base :: footer"></footer>
</body>
</html>
